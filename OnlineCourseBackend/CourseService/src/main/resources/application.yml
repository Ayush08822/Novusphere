server:
  port: 9000
spring:
  cloud:
    function:
      definition: updateStudentEnrollment
    stream:
      bindings:
        updateStudentEnrollment-in-0:
          destination: send-communication
          group: ${spring.application.name}
        sendEmail-out-0:
          destination: email-communication
          group: ${spring.application.name}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://localhost:7080/realms/OnlineCourseRealm/protocol/openid-connect/certs"
  application:
    name: "courseService"
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  data:
    mongodb:
      uri: "mongodb://localhost:27017/coursedb"

rabbitmq:
  host: localhost
  port: 5672
  username: guest
  password: guest
  connection-timeout: 10s

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/